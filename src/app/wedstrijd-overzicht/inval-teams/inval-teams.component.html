<div class="alert" [ngClass]="class">
    <div (click)="isCollapsed = !isCollapsed">
        {{ title }} ({{ numberOfPlayers }})
        <fa-icon
            class="float-right"
            [icon]="isCollapsed ? uitklappen : inklappen"
        ></fa-icon>
    </div>

    @for (speler of spelers; track speler.id) {
        <div [ngbCollapse]="isCollapsed">
            - {{ speler.naam }} {{ speler.rol == "coach" ? "(coach)" : "" }}
            @if (speler.rol == "invaller") {
                <fa-icon
                    (click)="DeleteSpeler(speler)"
                    [icon]="verwijderIcon"
                ></fa-icon>
            }
        </div>
    }
</div>
