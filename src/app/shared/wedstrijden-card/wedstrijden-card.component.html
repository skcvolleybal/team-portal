<ul class="list-group">
  @for (wedstrijd of wedstrijden; track wedstrijd) {
    <li class="list-group-item" [ngClass]="{
        'list-group-item-warning': wedstrijd.isMogelijk === null,
        'list-group-item-danger': wedstrijd.isMogelijk === false,
        'list-group-item-success': wedstrijd.isMogelijk === true
      }">
      <teamportal-wedstrijd [wedstrijd]="wedstrijd"></teamportal-wedstrijd>
      <div style="font-size: 12px;" class="card-subtitle mb-2 text-muted">
        {{ wedstrijd.tijd }}, {{ wedstrijd.locatie }}
      </div>
      @if (wedstrijd.isScheidsrechter) {
        <p class="card-text">
          <teamportal-scheidsrechter [isScheidsrechter]="wedstrijd.isScheidsrechter" [scheidsrechter]="wedstrijd.scheidsrechter"></teamportal-scheidsrechter>
          <teamportal-tellers [isTellers]="wedstrijd.isTellers" [tellers]="wedstrijd.tellers"></teamportal-tellers>
          {{ wedstrijd.tellers }}
        </p>
      }
    </li>
  }
</ul>
